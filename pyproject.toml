[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanchoice"
version = "0.2.2"
description = "A Python project for modelling sequential human choice using reinforcement-learning and Bayesian decision-making models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["reinforcement learning", "POMDP", "BAMDP", "I-POMDP", "computational neuroscience", "cognitive modelling"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.scripts]
humanchoice = "humanchoice.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8", "pandas-stubs"]

[tool.setuptools.package-data]
humanchoice = ["resources/*.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: statistical tests that take several seconds"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# pandas/matplotlib stubs are noisy for plotting code
module = "humanchoice.evaluation.visualization"
disable_error_code = ["operator", "arg-type", "str-bytes-safe"]

[tool.ruff]
line-length = 130
target-version = "py310"
